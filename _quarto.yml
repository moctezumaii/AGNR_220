      chapters:
        - chapters/week01.qmd
        - chapters/week02.qmd
        - chapters/week03.qmd
        - chapters/week04.qmd
    - part: "Unit 2: Probability and Uncertainty"
      chapters:
        - chapters/week05.qmd
        - chapters/week06.qmd
        - chapters/week07.qmd
    - part: "Unit 3: Inference and Hypothesis Testing"
      chapters:
        - chapters/week08.qmd
        - chapters/week09.qmd
        - chapters/week10.qmd
        - chapters/week11.qmd
    - part: "Unit 4: Comparing Groups"
      chapters:
        - chapters/week12.qmd
        - chapters/week13.qmd
        - chapters/week14.qmd
    - part: "Unit 5: Relationships Between Variables"
      chapters:
        - chapters/week15.qmd
    - chapters/week16.qmd
    - references.qmd
  navbar:
    search: true
    background: light
    left:
      - text: "Home"
        href: index.qmd
      - text: "AGNR 220 Course Page"
