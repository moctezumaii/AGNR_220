book:
  title: "Introduction to Statistical Analysis in Agriculture and the Natural Resources"
  subtitle: "AGNR 220 / SNR 220"
  author: "Dr. Alejandro Molina-Moctezuma"
  date: "August 17, 2026"
  page-footer: "Alejandro Molina-Moctezuma, 2026"
  downloads: [pdf, epub]
  sidebar:
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "Front Matter"
